name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Trusted Publishing: the `environment` name below MUST match the
# `Environment name` field in the PyPI pending publisher config.
# A mismatch fails publish with an opaque OIDC error. Keep the environment
# declared even when it carries no protection rules — it is the OIDC claim,
# not just an approval gate; deleting it breaks publishing outright. Whether
# a tag publishes straight through or waits for a reviewer is configured in
# the repo's environment settings, not here.
# Note: TestPyPI stage intentionally omitted — the tag is the release signal;
# pre-tag verification is `./build.sh check` plus the CI matrix on main.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: install build
        run: pip install build
      - name: build sdist + wheel
        run: python -m build
      - name: list dist artifacts
        run: ls -la dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/cli-agent-runner/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      # SHA-pinned to release/v1's composite. NOTE: this pins the composite source;
      # the image it pulls is still referenced by a moving ghcr tag, so a full pin
      # would require the ghcr digest — deferred (needs read:packages + release-time
      # validation). dependabot (github-actions) bumps this SHA.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          attestations: true

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      - name: extract CHANGELOG section for this tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for v$VERSION — using auto-generated notes." > release-notes.md
          fi
          echo "--- release-notes.md preview ---"
          cat release-notes.md
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            dist/*
